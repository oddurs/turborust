#:schema turborust.schema.json
# turborust's own site, built and served by turborust.
#
# Two nodes: a cached build task and a serve node that depends on it. Editing a
# Markdown file rebuilds and reloads; editing only the stylesheet swaps in place
# and keeps your scroll position.

[project]
ignore = ["**/target/**", "**/dist/**", "**/.git/**", "**/.turborust/**"]

[tasks.site-build]
cmd = "cargo run --quiet --manifest-path site/Cargo.toml"
inputs = ["site/src/**", "site/content/**", "site/static/**", "site/Cargo.toml"]
outputs = ["site/dist/index.html", "site/dist/docs.html", "site/dist/site.css", "site/dist/site.js"]

[services.site]
depends_on = ["site-build"]
serve = { dir = "site/dist", port = 8790, open = false }

[overlay]
position = "bottom-right"
theme = "auto"
