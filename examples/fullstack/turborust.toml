# A full-Rust stack: a shared crate, a backend that depends on it, and a
# frontend served by turborust itself.
#
# Note what is NOT here: watch globs. `cargo = "api"` derives them from the
# crate's path-dependency closure, so editing crates/shared restarts the api
# without anyone having to remember to list it.

[overlay]
# Shaped like Turbopack's devIndicators. Every value is also overridable at
# runtime from the overlay's own preferences pane.
position = "bottom-right"   # bottom-left | top-right | top-left
emoji = "🦀"
theme = "auto"              # auto | dark | light
errors = "overlay"          # overlay | badge | silent

[tasks.check]
cargo = "api"
cmd = "cargo check -p api"

[services.api]
cargo = "api"
port = 8788
depends_on = ["check"]
health = { http = "http://127.0.0.1:8788/healthz" }

[services.web]
depends_on = ["api"]
serve = { dir = "web", port = 8789 }
# One origin: the page calls /api/... with a relative path, so there is no CORS
# to configure and no API origin to swap out for production.
proxy = [{ path = "/api", to = "http://127.0.0.1:8788" }]
