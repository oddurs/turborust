name: release

# Tagging vX.Y.Z builds a binary for every supported platform and publishes them
# to a GitHub release with checksums and build provenance, then — only if a
# CARGO_REGISTRY_TOKEN secret exists — pushes the crate. Nothing is built by
# hand, so what people download is what CI produced from the tag.
#
# A pull request that touches this file, or the manifest it builds from, runs
# everything except publishing. A release workflow that only ever runs on a tag
# is one whose first real run is the release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "Cargo.toml", "Cargo.lock"]

permissions:
  contents: read

jobs:
  # Nothing is built until the tag and Cargo.toml agree. The archives are named
  # from the tag and `--version` reports the manifest, so a disagreement ships
  # one release holding two version numbers.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          set -eu
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
              exit 1
            fi
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
          else
            echo "version=${manifest}-dryrun.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner: Apple ships both toolchains,
          # and GitHub is retiring its Intel runners.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # musl gives a static binary, so one Linux artefact runs on any distro.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Default features only. `tls` needs cmake and nasm to build its crypto
      # backend; anyone who wants HTTPS for a dev frontend builds with it.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          name="turborust-${{ needs.preflight.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin="target/${{ matrix.target }}/release/turborust"
          [ "${{ runner.os }}" = Windows ] && bin="${bin}.exe"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE NOTICE.md "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "${name}.zip" "${name}" >/dev/null
            certutil -hashfile "${name}.zip" SHA256 | sed -n 2p | tr -d ' \r' > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" | cut -d' ' -f1 > "${name}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # Completions and the man page, generated by the binary rather than kept in
  # the repository, so they cannot drift from the CLI. Built once, on a host that
  # can run what it built.
  docs:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate
        run: |
          set -eu
          cargo build --release --locked
          bin=target/release/turborust
          name="turborust-${{ needs.preflight.outputs.version }}-completions"
          mkdir -p "dist/${name}"
          for sh in bash elvish fish powershell zsh; do
            "$bin" completions "$sh" > "dist/${name}/turborust.${sh}"
          done
          "$bin" man > "dist/${name}/turborust.1"
          # Empty output would package without complaint; refuse it here.
          find "dist/${name}" -type f -empty | grep . && exit 1
          cd dist
          tar czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" | cut -d' ' -f1 > "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: [build, docs]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: GitHub signs an attestation of which workflow, from
      # which commit, produced which file. Checksums come from the same workflow
      # as the archives, so they prove a download is intact and nothing about
      # where it came from; this is the part that does.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect checksums
        run: |
          cd dist
          for f in *.sha256; do
            printf '%s  %s\n' "$(cat "$f")" "${f%.sha256}"
          done > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # A version with a suffix (1.0.0-rc.1) is a pre-release, and never marked
      # latest: that is the release an installer takes.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  crate:
    # After the GitHub release, not beside it: crates.io cannot be unpublished,
    # so it is the last step and the first one that could not be undone.
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Skipped, not failed, without a token, so a fork can tag a release.
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "No CARGO_REGISTRY_TOKEN set; skipping crates.io."
            exit 0
          fi
          cargo publish --locked
