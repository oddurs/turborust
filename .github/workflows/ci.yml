name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      # The supervisor tests drive real processes and real pty output. Windows is
      # the only platform where the process-tree teardown cannot be exercised
      # locally on a maintainer's machine, so it matters most here.
      - run: cargo test --locked --test supervisor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  hygiene:
    name: commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The commit-msg hook catches this locally; CI catches it when someone
      # pushed with --no-verify, or from a machine without the hooks installed.
      - name: no tool attribution in commit messages
        run: |
          range="${{ github.event.pull_request.base.sha }}..HEAD"
          [ -n "${{ github.event.pull_request.base.sha }}" ] || range="HEAD~1..HEAD"
          if git log "$range" --format='%B' \
             | grep -inE 'co-authored-by:.*(claude|anthropic|copilot|cursor|gpt)|generated with|🤖|ai-generated'; then
            echo "::error::commit messages must not attribute work to a tool"
            exit 1
          fi
          echo "clean"

  roadmap:
    name: roadmap is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Not every checkout can install the tracker; when it cannot, say so and
      # move on rather than failing a build for a reason unrelated to the code.
      - name: install cairn
        id: cairn
        continue-on-error: true
        run: cargo install cairn --locked
      # A roadmap that has drifted from its items is the rot cairn exists to
      # prevent, so the check belongs in CI rather than in discipline.
      - name: roadmap validates and is up to date
        if: steps.cairn.outcome == 'success'
        run: |
          cairn check
          cairn render
          git diff --exit-code ROADMAP.md
      - name: skipped
        if: steps.cairn.outcome != 'success'
        run: echo "::notice::cairn unavailable; roadmap check skipped"
