name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      # The supervisor tests drive real processes and real pty output. Windows is
      # the only platform where the process-tree teardown cannot be exercised
      # locally on a maintainer's machine, so it matters most here.
      - run: cargo test --locked --test supervisor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  # The declared rust-version is a promise; this keeps it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `+version` explicitly: rust-toolchain.toml pins `stable`, and a pinned
      # toolchain file outranks the one the action installs, so a bare
      # `cargo build` here would quietly check the wrong compiler.
      - run: cargo +${{ steps.msrv.outputs.version }} build --locked

  supply-chain:
    # Advisories, licences and sources, against deny.toml. Every machine this
    # runs on builds its users' code; it should not carry a known vulnerability
    # quietly, or take on a copyleft licence without somebody deciding to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  packaging:
    # What `cargo publish` makes of this, checked on every change rather than
    # discovered at release time: a file the include list leaves out that the
    # build needs is invisible to `cargo build` and fatal to `cargo install`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked

  hygiene:
    name: commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The commit-msg hook catches this locally; CI catches it when someone
      # pushed with --no-verify, or from a machine without the hooks installed.
      - name: no tool attribution in commit messages
        run: |
          range="${{ github.event.pull_request.base.sha }}..HEAD"
          [ -n "${{ github.event.pull_request.base.sha }}" ] || range="HEAD~1..HEAD"
          if git log "$range" --format='%B' \
             | grep -inE 'co-authored-by:.*(claude|anthropic|copilot|cursor|gpt)|generated with|🤖|ai-generated'; then
            echo "::error::commit messages must not attribute work to a tool"
            exit 1
          fi
          echo "clean"

  schema:
    name: schema is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The output schemas are compared with the base branch's.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Committed because editors fetch it by URL, so it has to exist — but
      # generated, so it must not be allowed to drift from the types.
      - run: cargo run --quiet -- schema > turborust.schema.json
      - run: git diff --exit-code turborust.schema.json
      # The JSON output contract (cairn 0078): in sync with the types, and not
      # broken since the base without a schemaVersion bump.
      - run: scripts/schemas --against ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  roadmap:
    name: roadmap validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The audit reads `Refs:` trailers from the default branch's history.
          fetch-depth: 0
      # Drift `cairn check` cannot see: an item left open after its work merged,
      # a finished milestone never closed. Findings land as annotations on the
      # item files; only a contradiction fails the job. On a pull request it
      # also names items the branch refs but leaves open, as changeset-bot
      # names a missing changeset: a nudge, never a gate.
      - name: tracker matches the work
        run: scripts/audit ${{ github.event_name == 'pull_request' && format('--branch {0}', github.event.pull_request.base.sha) || '' }}
      # ROADMAP.md is rendered after each merge and published on the `roadmap`
      # branch (roadmap.yml); it is not tracked on main. A render carried in
      # pull requests made every two that close items conflict (cairn 0108),
      # and main cannot take the bot's commit directly (0109).
      - name: the roadmap stays off main
        run: |
          if git ls-files --error-unmatch ROADMAP.md >/dev/null 2>&1; then
            echo "::error file=ROADMAP.md::ROADMAP.md is published on the roadmap branch, not tracked here: git rm --cached ROADMAP.md"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      # The package is `cairn-md`, from its own repository. `cargo install cairn`
      # resolves to an unrelated crate on crates.io that does not compile, and
      # because this step used to be allowed to fail, the roadmap check below
      # was skipped on every run without anyone being told.
      #
      # Pinned to a tag, with --locked, so a cairn release cannot change what
      # this job means. v0.3.0 reads this format-2 project as is: `check` and
      # `render` never take the write lock that asks for `cairn migrate`.
      - name: install cairn
        run: cargo install --locked --git https://github.com/oddurs/cairn --tag v0.3.0 cairn-md
      - name: items validate
        run: cairn check
