name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      # The supervisor tests drive real processes and real pty output. Windows is
      # the only platform where the process-tree teardown cannot be exercised
      # locally on a maintainer's machine, so it matters most here.
      - run: cargo test --locked --test supervisor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  roadmap:
    name: roadmap is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cairn --locked || true
      # A roadmap that has drifted from the items is the rot cairn exists to
      # prevent, so the check belongs in CI rather than in discipline.
      - run: cairn check
      - run: cairn render && git diff --exit-code ROADMAP.md
