name: Bug
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it did. Paste the output.
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Your turborust.toml
      description: Trimmed to the part that matters, if it is large.
      render: toml
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: turborust 0.1.0, macOS 15 arm64
    validations: { required: true }
  - type: markdown
    attributes:
      value: |
        If it involves the cache, `turborust why <task>` output is usually the
        single most useful thing you can include.
